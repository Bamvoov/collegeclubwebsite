<main class="w-full max-w-[1440px] mx-auto px-4 md:px-gutter py-stack-xl relative z-10 flex flex-col items-center">
    
    <!-- Title Section -->
    <div class="relative mt-12 mb-24 max-w-2xl w-full mx-auto px-4 group">
        <!-- Shadow element behind -->
        <div class="absolute inset-0 bg-[#e9ea00] -rotate-2 shadow-[8px_8px_0px_0px_#141408] translate-x-3 translate-y-3 md:translate-x-5 md:translate-y-5 z-0">
        </div>
        <!-- Title Box -->
        <div class="relative border-4 border-primary bg-background p-6 md:p-8 flex justify-center torn-edge-alt -rotate-2 z-10">
            <h1 class="font-headline-xl text-5xl sm:text-7xl md:text-8xl uppercase tracking-tighter text-primary">
                THE SQUAD
            </h1>
        </div>
    </div>

    <!-- Teams Grid -->
    <div class="grid grid-cols-1 md:grid-cols-3 gap-8 md:gap-12 w-full max-w-6xl mx-auto px-4">
        
        <!-- EDITORIAL -->
        <div class="bg-primary text-background p-6 md:p-8 flex flex-col shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] rotate-1 group hover:-rotate-1 transition-transform">
            <div class="mb-6">
                <h2 class="font-headline-lg text-2xl md:text-3xl uppercase tracking-tighter bg-[#e9ea00] text-background inline-block px-3 py-1">
                    EDITORIAL
                </h2>
            </div>
            <ul class="space-y-4 font-label-mono text-sm md:text-base w-full">
                <li class="border-b-2 border-dashed border-background pb-2">Alice 'The Pen' Smith</li>
                <li class="border-b-2 border-dashed border-background pb-2">Bob 'No Comment' Jones</li>
                <li class="border-b-2 border-dashed border-background pb-2">Charlie 'Headline' Brown</li>
            </ul>
        </div>

        <!-- VISUALS -->
        <div class="bg-primary text-background p-6 md:p-8 flex flex-col shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] -rotate-1 group hover:rotate-1 transition-transform">
            <div class="mb-6">
                <h2 class="font-headline-lg text-2xl md:text-3xl uppercase tracking-tighter bg-[#e9ea00] text-background inline-block px-3 py-1">
                    VISUALS
                </h2>
            </div>
            <ul class="space-y-4 font-label-mono text-sm md:text-base w-full">
                <li class="border-b-2 border-dashed border-background pb-2">Dave 'Flash' Davis</li>
                <li class="border-b-2 border-dashed border-background pb-2">Eve 'Candid' Evans</li>
            </ul>
        </div>

        <!-- OPERATIONS -->
        <div class="bg-primary text-background p-6 md:p-8 flex flex-col shadow-[4px_4px_0px_0px_rgba(0,0,0,1)] rotate-2 group hover:-rotate-2 transition-transform">
            <div class="mb-6">
                <h2 class="font-headline-lg text-2xl md:text-3xl uppercase tracking-tighter bg-[#e9ea00] text-background inline-block px-3 py-1">
                    OPERATIONS
                </h2>
            </div>
            <ul class="space-y-4 font-label-mono text-sm md:text-base w-full">
                <li class="border-b-2 border-dashed border-background pb-2">Frank 'The Fixer' Foster</li>
                <li class="border-b-2 border-dashed border-background pb-2">Grace 'Logistics' Green</li>
            </ul>
        </div>

    </div>

</main>
